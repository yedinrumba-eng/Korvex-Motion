<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/fonts.css">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070b18}
  #stage{position:absolute;inset:0;
    background:radial-gradient(900px 600px at 50% 45%,rgba(43,68,230,.22),transparent 70%),#070b18}
  #pill{position:absolute;left:50%;top:50%;height:120px;width:120px;border-radius:60px;
    background:linear-gradient(180deg,#34e27a,#16a34a);
    box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 20px 60px -10px rgba(34,197,94,.55);
    transform:translate(-50%,-50%);overflow:hidden;display:flex;align-items:center;justify-content:center}
  #txt{font:700 54px/1 'Inter';color:#04210f;white-space:nowrap;letter-spacing:-.5px;display:flex}
  #txt span{display:inline-block;white-space:pre}
  #ring{position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;
    border:3px solid #34e27a;transform:translate(-50%,-50%);opacity:0}
</style></head>
<body><div id="stage"><div id="ring"></div><div id="pill"><div id="txt"></div></div></div>
<script>
window.DURATION = 3;
const txt = document.getElementById('txt'), pill = document.getElementById('pill'), ring = document.getElementById('ring');
const LETTERS = [...'Studio ready.'].map(c => { const s = document.createElement('span'); s.textContent = c; txt.appendChild(s); return s; });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
// Resorte amortiguado analitico: determinista, sin estado.
function spring(t, w = 12, z = 0.45) {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const outBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const dotY = t => 420 * (1 - spring(t, 11, 0.42));
const pillW = t => 120 + 560 * spring(t - 1.0, 10, 0.55);

window.seek = function (t) {
  // 1) El punto sube con resorte + squash & stretch segun la velocidad vertical
  const y = dotY(t), vy = (dotY(t + 0.004) - dotY(t - 0.004)) / 0.008;
  const k = clamp(Math.abs(vy) / 2600, 0, 0.35);
  const s = 0.3 + 0.7 * spring(t, 13, 0.5);
  // 2) A partir de 1.0 s se estira a pildora (el beep cae justo aqui)
  const w = pillW(t);
  pill.style.width = w + 'px';
  pill.style.transform = `translate(-50%,-50%) translateY(${y}px) scale(${s * (1 - k * 0.6)},${s * (1 + k)})`;
  // 3) Anillo de confirmacion sincronizado con el beep
  const r = clamp((t - 1.0) / 0.55);
  ring.style.opacity = t >= 1.0 ? (0.7 * (1 - r)).toFixed(3) : 0;
  ring.style.transform = `translate(-50%,-50%) scale(${1 + 1.6 * (1 - Math.pow(1 - r, 3))})`;
  // 4) Texto letra por letra
  LETTERS.forEach((el, i) => {
    const p = clamp((t - 1.18 - i * 0.028) / 0.38);
    const e = p > 0 ? outBack(p) : 0;
    el.style.transform = `translateY(${(1 - e) * 46}px)`;
    el.style.opacity = clamp(p * 1.6).toFixed(3);
  });
};
window.seek(0);
</script></body></html>
